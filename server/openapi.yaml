components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Personal access token (lt_pat_...) from Settings, API Tokens.
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
          description: Present for some refusals, e.g. cardio_disabled.
    CardioInput:
      type: object
      required: [activity, duration_min]
      properties:
        activity: {type: string, maxLength: 100}
        duration_min: {type: integer, minimum: 1, maximum: 1440}
        distance: {type: number}
        distance_unit: {type: string}
        avg_hr: {type: integer}
        notes: {type: string}
        date: {type: string}
        external_id: {type: string}
    PhotoInput:
      type: object
      required: [url]
      properties:
        url: {type: string}
        date: {type: string}
    BodyStatInput:
      type: object
      properties:
        weight: {type: number}
        weight_unit: {type: string, enum: [kg, lb]}
        bodyFat: {type: number}
        waist: {type: number}
        hips: {type: number}
        neck: {type: number}
        chest: {type: number}
        biceps: {type: number}
        thighs: {type: number}
        calves: {type: number}
    SetInput:
      type: object
      required: [exercise_id]
      description: |
        Give reps, or one of duration_sec, distance_m and calories instead
        (sending more than one of those three is a 400). Limits match the
        MCP log_set tool. Numeric strings and "true"/"false" are tolerated
        for numbers and flags, but send real JSON types.
      properties:
        exercise_id: {type: integer}
        reps: {type: integer, minimum: 0, maximum: 1000}
        weight: {type: number, minimum: 0, maximum: 10000}
        rpe: {type: number, minimum: 1, maximum: 10}
        warmup: {type: boolean}
        completed: {type: boolean}
        workout_id: {type: integer}
        duration_sec:
          type: integer
          minimum: 1
          maximum: 86400
          description: Seconds. With duration_l_sec and duration_r_sec it must equal the shorter side, else 400.
        duration_l_sec:
          type: integer
          minimum: 1
          maximum: 86400
          description: Left side hold in seconds, for a hold timed per side. Send together with duration_r_sec.
        duration_r_sec:
          type: integer
          minimum: 1
          maximum: 86400
          description: Right side hold in seconds. Send together with duration_l_sec.
        distance_m:
          type: number
          minimum: 0
          exclusiveMinimum: true
          maximum: 1000000
        calories: {type: integer, minimum: 1, maximum: 100000}
    StartInput:
      type: object
      properties:
        template_id: {type: integer}
