openapi: 3.0.3
info:
  title: LiftTrace public API
  version: 1.0.0
  description: |
    Versioned REST API for scripts and automations. Prose reference:
    docs/public-api.md. Off unless the server sets PUBLIC_API_ENABLED=1; while
    disabled every route, including this file, answers 404. Write routes also
    need PUBLIC_API_WRITE_ENABLED=1 (404 otherwise). Responses are the bare
    JSON data object; schemas here are deliberately loose.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
tags:
  - name: read
    description: Requires a token with mcp:read.
  - name: write
    description: Requires a token with mcp:write and PUBLIC_API_WRITE_ENABLED=1 on the server.
paths:
  /cardio:
    get:
      summary: Cardio sessions in a date range
      tags: [read]
      x-required-scope: mcp:read
      security:
        - bearerAuth: [mcp:read]
      parameters:
        - name: start
          in: query
          required: false
          description: Inclusive start date, YYYY-MM-DD.
          schema:
            type: string
        - name: end
          in: query
          required: false
          description: Inclusive end date, YYYY-MM-DD.
          schema:
            type: string
        - name: activity
          in: query
          required: false
          description: Case-insensitive substring of the activity name.
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request (invalid date, unknown exercise, cardio_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
        '403':
          description: Token lacks the required scope.
        '429':
          description: Per-token rate limit exceeded (see Retry-After).
    post:
      summary: Log one cardio session
      tags: [write]
      x-required-scope: mcp:write
      security:
        - bearerAuth: [mcp:write]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardioInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '400':
          description: Bad request (invalid date, unknown exercise, cardio_disabled).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Missing or invalid token.
        '403':
          description: Token lacks the required scope.
        '404':
          description: Public API writes are not enabled on this server.
        '429':
          description: Per-token rate limit exceeded (see Retry-After).
  /body-stats:
    get:
      summary: Body stats for every logged date in a range
      tags: [read]
