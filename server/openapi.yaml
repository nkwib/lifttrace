      tags: [read]
      x-required-scope: mcp:read
      security:
        - bearerAuth: [mcp:read]
      parameters:
        - name: name
          in: path
          required: true
          description: Exercise name. An exact case/accent-insensitive match wins (duplicates resolve to your own, then lowest id); otherwise substring, and several partial matches return ambiguous with candidates and candidate_exercises (exercise_id, name).
          schema:
            type: string
        - name: exercise_id
          in: query
          required: false
          description: Resolve by id instead of name (the path name is then ignored). Must be global or your own, else 400.
          schema:
